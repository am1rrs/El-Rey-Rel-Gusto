<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - El Rey del Gusto</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-container">
            <div class="lang-switcher login-switcher" role="group" aria-label="Language">
                <button type="button" class="lang-btn" data-lang="en">EN</button>
                <button type="button" class="lang-btn" data-lang="fr">FR</button>
                <button type="button" class="lang-btn" data-lang="ar">AR</button>
            </div>
            <h1 class="login-title">El Rey del Gusto</h1>
            <h2 class="login-subtitle" data-i18n="login.subtitle">Admin Dashboard</h2>
            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email" data-i18n="login.email">Email</label>
                    <input type="email" id="email" autocomplete="username" required placeholder="admin@elrey.com">
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="login.password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="login-btn" data-i18n="login.submit">Sign in</button>
                <p id="login-hint" class="login-hint" hidden></p>
                <p id="login-error" class="login-error" hidden></p>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard" style="display: none;">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-left">
                <h1 class="dashboard-title">El Rey del Gusto</h1>
                <span class="dashboard-subtitle" data-i18n="dashboard.subtitle">Administration</span>
            </div>
            <div class="header-right">
                <div class="lang-switcher" role="group" aria-label="Language">
                    <button type="button" class="lang-btn" data-lang="en">EN</button>
                    <button type="button" class="lang-btn" data-lang="fr">FR</button>
                    <button type="button" class="lang-btn" data-lang="ar">AR</button>
                </div>
                <button type="button" class="refresh-btn" id="refresh-orders-btn" data-i18n="refresh">Refresh</button>
                <button type="button" class="logout-btn" id="logout-btn" data-i18n="logout">Sign out</button>
            </div>
        </header>

        <!-- Stats Cards -->
        <div class="stats-container">
            <div class="stat-card clickable" data-status="pending" role="button" tabindex="0">
                <div class="stat-icon">📋</div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-pending">0</div>
                    <div class="stat-label" data-i18n="stats.pending">Pending</div>
                </div>
            </div>
            <div class="stat-card clickable" data-status="preparing" role="button" tabindex="0">
                <div class="stat-icon">👨‍🍳</div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-preparing">0</div>
                    <div class="stat-label" data-i18n="stats.preparing">In preparation</div>
                </div>
            </div>
            <div class="stat-card clickable" data-status="ready" role="button" tabindex="0">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-ready">0</div>
                    <div class="stat-label" data-i18n="stats.ready">Ready</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-total">0 DA</div>
                    <div class="stat-label" data-i18n="stats.total">Today's total</div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-container">
            <div class="filter-group">
                <label data-i18n="filters.status">Status:</label>
                <div class="status-checkboxes" id="status-checkboxes">
                    <label class="chk"><input type="checkbox" class="status-checkbox" value="pending"><span data-i18n="status.pending">Pending</span></label>
                    <label class="chk"><input type="checkbox" class="status-checkbox" value="preparing"><span data-i18n="status.preparing">In preparation</span></label>
                    <label class="chk"><input type="checkbox" class="status-checkbox" value="ready"><span data-i18n="status.ready">Ready</span></label>
                    <label class="chk"><input type="checkbox" class="status-checkbox" value="delivered"><span data-i18n="status.delivered">Delivered</span></label>
                    <label class="chk"><input type="checkbox" class="status-checkbox" value="cancelled"><span data-i18n="status.cancelled">Cancelled</span></label>
                </div>
            </div>
            <div class="filter-group">
                <label for="type-filter" data-i18n="filters.type">Type:</label>
                <select id="type-filter">
                    <option value="all" data-i18n="filters.all">All</option>
                    <option value="dine-in" data-i18n="type.dine-in">Dine-in</option>
                    <option value="delivery" data-i18n="type.delivery">Delivery</option>
                    <option value="takeaway" data-i18n="type.takeaway">Takeaway</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="date-filter" data-i18n="filters.dateRange">Date range:</label>
                <select id="date-filter">
                    <option value="today" data-i18n="dateRange.today">Today</option>
                    <option value="week" data-i18n="dateRange.week">This week</option>
                    <option value="month" data-i18n="dateRange.month">This month</option>
                    <option value="custom" data-i18n="dateRange.custom">Custom</option>
                </select>
                <div class="custom-date-range" id="custom-date-range" hidden>
                    <input type="date" id="date-from" data-i18n-ph="filters.dateFrom">
                    <input type="date" id="date-to" data-i18n-ph="filters.dateTo">
                </div>
            </div>
            <div class="filter-group">
                <label for="payment-status-filter" data-i18n="filters.paymentStatus">Payment status:</label>
                <select id="payment-status-filter">
                    <option value="all" data-i18n="filters.all">All</option>
                    <option value="pending" data-i18n="payment.pending">Pending</option>
                    <option value="paid" data-i18n="payment.paid">Paid</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="payment-method-filter" data-i18n="filters.paymentMethod">Payment method:</label>
                <select id="payment-method-filter">
                    <option value="all" data-i18n="filters.all">All</option>
                    <option value="cash" data-i18n="payment.cash">Cash</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="search-filter" data-i18n="filters.search">Search:</label>
                <input type="text" id="search-filter" data-i18n-ph="filters.searchPlaceholder" placeholder="Order, phone, item, address...">
            </div>
            <div class="filter-group filter-actions">
                <button type="button" id="clear-filters-btn" class="btn-tool" hidden data-i18n="filters.clear">Clear filters</button>
            </div>
        </div>

        <!-- Firestore connection / error status -->
        <div id="data-status" class="data-status" style="display: none;"></div>

        <!-- Toolbar -->
        <div class="actions-toolbar">
            <button type="button" class="btn-tool" id="export-csv-btn" data-i18n="export.csv">Export CSV</button>
            <button type="button" class="btn-tool" id="print-btn" data-i18n="export.print">Print</button>
        </div>

        <!-- Orders Table -->
        <div class="orders-container">
            <h2 class="section-title" data-i18n="orders.title">Orders</h2>
            <span id="results-count" class="results-count"></span>
            <div class="table-wrapper">
                <table id="orders-table" class="orders-table">
                    <thead>
                        <tr>
                            <th scope="col" data-sort-key="orderId" data-i18n="table.orderId">Order ID</th>
                            <th scope="col" data-sort-key="timestamp" class="sort-desc" aria-sort="descending" data-i18n="table.date">Date / Time</th>
                            <th scope="col" data-sort-key="customer" data-i18n="table.customer">Customer</th>
                            <th scope="col" data-sort-key="items" data-i18n="table.items">Items</th>
                            <th scope="col" data-sort-key="type" data-i18n="table.type">Type</th>
                            <th scope="col" data-sort-key="total" data-i18n="table.total">Total</th>
                            <th scope="col" data-sort-key="status" data-i18n="table.status">Status</th>
                            <th scope="col" data-i18n="table.actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody"></tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <div class="pagination-size">
                    <label for="page-size" data-i18n="pagination.size">Per page</label>
                    <select id="page-size">
                        <option value="10">10</option>
                        <option value="25" selected>25</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <div class="pagination-nav">
                    <button type="button" id="prev-page" data-i18n="pagination.prev">Prev</button>
                    <span id="page-info" class="page-info">Page 1 of 1</span>
                    <button type="button" id="next-page" data-i18n="pagination.next">Next</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div id="order-modal" class="modal" role="dialog" aria-modal="true" style="display: none;">
        <div class="modal-content">
            <button type="button" class="modal-close" data-action="close" data-i18n-title="modal.close" aria-label="Close">&times;</button>
            <div id="order-details"></div>
        </div>
    </div>

    <!-- Audio notification -->
    <audio id="notification-sound" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBDGH0fPTgjMGHm7A7+OZURE=" type="audio/wav">
    </audio>

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/order-service.js"></script>
    <script src="auth.js"></script>
    <script src="i18n.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
