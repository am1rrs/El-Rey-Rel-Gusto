<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - El Rey del Gusto</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-container">
            <h1 class="login-title">El Rey del Gusto</h1>
            <h2 class="login-subtitle">Tableau de Bord Admin</h2>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="admin@elrey.com">
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="login-btn">Se connecter</button>
                <p class="demo-credentials">
                    <small>Demo: admin@elrey.com / admin123</small>
                </p>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard" style="display: none;">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-left">
                <h1 class="dashboard-title">El Rey del Gusto</h1>
                <span class="dashboard-subtitle">Administration</span>
            </div>
            <div class="header-right">
                <button class="refresh-btn" onclick="refreshOrders()">🔄 Actualiser</button>
                <button class="logout-btn" onclick="handleLogout()">Déconnexion</button>
            </div>
        </header>

        <!-- Stats Cards -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">📋</div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-pending">0</div>
                    <div class="stat-label">En attente</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👨‍🍳</div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-preparing">0</div>
                    <div class="stat-label">En préparation</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-ready">0</div>
                    <div class="stat-label">Prêtes</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-total">0 DA</div>
                    <div class="stat-label">Total du jour</div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-container">
            <div class="filter-group">
                <label>Status:</label>
                <select id="status-filter" onchange="applyFilters()">
                    <option value="all">Tous</option>
                    <option value="pending">En attente</option>
                    <option value="preparing">En préparation</option>
                    <option value="ready">Prêt</option>
                    <option value="delivered">Livré</option>
                    <option value="cancelled">Annulé</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Type:</label>
                <select id="type-filter" onchange="applyFilters()">
                    <option value="all">Tous</option>
                    <option value="dine-in">Sur place</option>
                    <option value="delivery">Livraison</option>
                    <option value="takeaway">À emporter</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Recherche:</label>
                <input type="text" id="search-filter" placeholder="Numéro de commande ou téléphone" oninput="applyFilters()">
            </div>
        </div>

        <!-- Orders List -->
        <div class="orders-container">
            <h2 class="section-title">Commandes</h2>
            <div id="orders-list"></div>
            <div id="no-orders" class="no-orders" style="display: none;">
                <p>Aucune commande trouvée</p>
            </div>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div id="order-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <button class="modal-close" onclick="closeOrderModal()">&times;</button>
            <div id="order-details"></div>
        </div>
    </div>

    <!-- Audio notification -->
    <audio id="notification-sound" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBDGH0fPTgjMGHm7A7+OZURE=" type="audio/wav">
    </audio>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/order-service.js"></script>
    <script src="auth.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
