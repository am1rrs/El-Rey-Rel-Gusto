<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>قائمة المطعم - طلب الطعام</title>
    <style>
        body {font-family: Arial, sans-serif; direction: rtl; margin: 2rem;}
        .menu-item {border: 1px solid #ccc; padding: 1rem; margin: 1rem 0;}
        input, select, button {padding: 0.5rem; margin: 0.2rem;}
        #orderSummary {margin-top: 2rem; padding: 1rem; background: #f9f9f9;}
    </style>
</head>
<body>
    <h1>قائمة المطعم</h1>

    <div id="menu">
        <!-- مثال على عناصر القائمة (يمكنك تعديلها) -->
        <div class="menu-item">
            <h3>مشاوي mixed grill</h3>
            <p>طبق مشاوي متنوعة مع الأرز والسلطة</p>
            <label>
                الكمية:
                <input type="number" min="1" value="1" data-item="مشاوي mixed grill" data-price="45">
            </label>
        </div>
        <div class="menu-item">
            <h3>كبسة دجاج</h3>
            <p>أرز بسمتي مع دجاج متبل ومكسرات</p>
            <label>
                الكمية:
                <input type="number" min="1" value="1" data-item="كبسة دجاج" data-price="35">
            </label>
        </div>
        <div class="menu-item">
            <h3>سلطة فتوش</h3>
            <p>سلطة خضار طازجة مع الخبز المحمص</p>
            <label>
                الكمية:
                <input type="number" min="1" value="1" data-item="سلطة فتوش" data-price="15">
            </label>
        </div>
    </div>

    <button id="checkoutBtn">إتمام الطلب وإرسال إلى واتساب</button>

    <div id="orderSummary"></div>

    <script>
        // عند الضغط على زر الإتمام
        document.getElementById('checkoutBtn').addEventListener('click', function () {
            const items = [];
            let total = 0;

            // جمع جميعInputs التي فيها قيمة > 0
            document.querySelectorAll('.menu-item input[type="number"]').forEach(input => {
                const qty = parseInt(input.value) || 0;
                if (qty > 0) {
                    const name = input.dataset.item;
                    const price = parseFloat(input.dataset.price) || 0;
                    const subtotal = qty * price;
                    total += subtotal;
                    items.push(`${name} × ${qty} = ${subtotal} ريال`);
                }
            });

            if (items.length === 0) {
                alert('يرجى اختيار mindestens عنصر واحد من القائمة');
                return;
            }

            // إعداد الرسالة التي سيتم إرسالها إلى واتساب
            const phoneNumber = '966501234567'; // ← غير هذا الرقم إلى رقم المطعم مع رمز الدولة بدون + أو مسافات
            let message = '*طلب جديد من موقع المطعم*%0A';
            message += items.map(i => `- ${i}`).join('%0A');
            message += `%0A*الإجمالي:* ${total} ريال%0A`;
            message += `%0A*شكراً لثقتكم!*`;

            // بناء رابط واتساب click-to-chat
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

            // فتح واتساب في نافذة جديدة (أو تطبيق إذا كان الجهاز يدعمه)
            window.open(whatsappUrl, '_blank');
        });
    </script>
</body>
</html>
